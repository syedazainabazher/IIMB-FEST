    <hr>
    <h2>Register for the fest</h2>
<form action="/register">
    <label for="name">Write your name : </label>
    <input type="text" name="name" id="name" required minlength="2" maxlength="12">
    <br><br>
    <label for="email">Write your email : </label>
    <input type="email" name="email" id="email" required>
    <br><br>
    <label for="tshirtsize">Select your T-Shirt size : </label>
    <select name="tshirtsize" id="tshirtsize">
        <option value="0">please select an option</option>
        <option value="38">38</option>
        <option value="40">40</option>
        <option value="42">42</option>
        <option value="44">44</option>
    </select>
    <br><br>
    <label for="attendee_type">Alumni</label>
    <input type="radio" name="attendee_type" id="attendee_type" value="alumni">
    <label for="attendee_type">Student</label>
    <input type="radio" name="attendee_type" id="attendee_type" value="student">
    <br><br>
    <label for="checkbox">Do you agree to all the conditions?</label>
    <input type="checkbox"name="tnc" id="checkbox" required>
    <br><br>
    <button type="submit">Register</button>
</form>
